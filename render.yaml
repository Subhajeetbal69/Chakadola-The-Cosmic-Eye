# render.yaml — Render.com Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chakadola-the-cosmic-eye
    runtime: node
    region: singapore   # Closest to your Supabase ap-northeast-1 (Tokyo). Adjust if needed.
    plan: free

    buildCommand: npm install && npm run build
    startCommand: npm start

    # Health check endpoint — Render pings this to verify the service is alive
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000      # Render injects its own PORT; this is a safe default

      - key: APP_URL
        value: https://chakadola-the-cosmic-eye.onrender.com

      - key: GEMINI_API_KEY
        sync: false       # Must be manually set in Render dashboard (secret)

      - key: DATABASE_URL
        sync: false       # Must be manually set in Render dashboard (secret)

      - key: SPACETRACK_USER
        sync: false       # Optional — set only if using Space-Track.org

      - key: SPACETRACK_PASSWORD
        sync: false       # Optional — set only if using Space-Track.org
