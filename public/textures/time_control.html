<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Div 4 — Zoom &amp; Speed Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #071019;
      --line:     rgba(201,217,138,.11);
      --line-dim: rgba(255,255,255,.06);
      --text:     #edf2ec;
      --muted:    #8ca49a;
      --dim:      #526258;
      --lime:     #c9d98a;
      --lime-lo:  rgba(201,217,138,.07);
      --lime-glo: rgba(201,217,138,.28);
      --mono: "DM Mono", ui-monospace, monospace;
      --sans: Manrope, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(circle at 20% 70%, rgba(94,129,91,.13), transparent 42%),
        radial-gradient(circle at 80% 20%, rgba(201,217,138,.05), transparent 38%),
        #071019;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    /* ── Control bar shell ── */
    .control-bar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 7px 9px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(165deg, rgba(13,30,44,.97) 0%, rgba(9,18,27,.99) 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.02) inset,
        0 16px 48px -16px rgba(0,0,0,.7),
        0 0 30px -12px rgba(201,217,138,.06);
    }

    /* ── Divider ── */
    .divider {
      width: 1px;
      height: 22px;
      background: var(--line-dim);
      margin: 0 5px;
      flex-shrink: 0;
    }

    /* ── Icon buttons (zoom, reset) ── */
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: grid; place-items: center;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color .18s, background .18s, border-color .18s;
      flex-shrink: 0;
    }
    .icon-btn svg { width: 15px; height: 15px; }
    .icon-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border-color: var(--line-dim);
    }
    .icon-btn:active {
      background: rgba(255,255,255,.03);
      transform: scale(.93);
    }

    /* ── Speed group ── */
    .speed-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Speed label prefix */
    .speed-prefix {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--dim);
      margin-right: 4px;
      user-select: none;
    }

    .speed-btn {
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: .04em;
      padding: 7px 11px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color .18s, background .18s, border-color .18s, box-shadow .22s;
      white-space: nowrap;
    }
    .speed-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,.05);
      border-color: var(--line-dim);
    }
    .speed-btn.active {
      color: #0f1a06;
      background: linear-gradient(170deg, #d9ed98, #b2c85a);
      border-color: transparent;
      box-shadow: 0 4px 14px -4px rgba(180,210,80,.55), 0 0 0 1px rgba(255,255,255,.08) inset;
    }
    .speed-btn.active:hover { filter: brightness(1.06); }
  </style>
</head>
<body>

  <div class="control-bar" role="toolbar" aria-label="Viewport controls">

    <!-- Zoom In -->
    <button class="icon-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.35-4.35"/>
        <path d="M11 8v6M8 11h6"/>
      </svg>
    </button>

    <!-- Zoom Out -->
    <button class="icon-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.35-4.35"/>
        <path d="M8 11h6"/>
      </svg>
    </button>

    <!-- Reset -->
    <button class="icon-btn" id="resetBtn" title="Reset view" aria-label="Reset view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>

    <!-- Divider -->
    <div class="divider" aria-hidden="true"></div>

    <!-- Speed controls -->
    <div class="speed-group" role="group" aria-label="Simulation speed">
      <span class="speed-prefix">Speed</span>

      <button class="speed-btn" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="30">30×</button>
      <button class="speed-btn active" data-speed="60">60×</button>
      <button class="speed-btn" data-speed="150">150×</button>
    </div>

  </div>

  <script>
    /* Speed selection */
    const speedBtns = document.querySelectorAll('.speed-btn');
    speedBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        speedBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    /* Zoom / reset — visual feedback only for demo */
    ['zoomIn','zoomOut','resetBtn'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('click', () => {
        el.style.color = 'var(--lime)';
        setTimeout(() => { el.style.color = ''; }, 260);
      });
    });
  </script>

</body>
</html>
